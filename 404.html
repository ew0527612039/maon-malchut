<style>:root{--bg:#FFFBF8;--surface:#fff;--ink:#3A2E4F;--muted:#6E6480;--line:#F0E3E6;--pink:#E0668E;--pink-d:#B83E68;--blush:#FBE1E7;--teal:#1F7C80;--mint:#E3F5F1;--sky:#0C4A6E}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.65 Assistant,system-ui,sans-serif}
a{color:inherit}img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:rgba(255,251,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;min-height:76px}header img{height:56px;width:auto}
header nav{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:800;text-decoration:none;border:2px solid transparent;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}.btn-pink{background:var(--pink);color:#fff;box-shadow:0 12px 24px -12px var(--pink)}.btn-line{border-color:var(--line);background:#fff}
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.kick{display:inline-block;background:var(--mint);color:var(--teal);font-weight:800;font-size:15px;padding:6px 14px;border-radius:999px}
h1{font:700 clamp(36px,5vw,58px)/1.1 Fredoka,Assistant,sans-serif;margin:14px 0}h1 span{color:var(--pink)}
h2{font:700 clamp(28px,3.4vw,40px)/1.15 Fredoka,Assistant,sans-serif;margin:0 0 14px;color:var(--sky)}h3{margin:0 0 4px;font-size:21px;color:var(--sky)}
.lead{font-size:20px;color:var(--muted);max-width:56ch}.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.ph{border-radius:40px 40px 40px 12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(58,46,79,.45);aspect-ratio:4/4.3}.ph img{width:100%;height:100%;object-fit:cover}
section{padding:56px 0}.alt{background:linear-gradient(180deg,#fff,rgba(240,249,255,.6))}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.card p{margin:0;color:rgba(3,105,161,.75)}
.v0{background:#FDF2F8}.v1{background:#F0F9FF}.v2{background:#FAF5FF}.v3{background:#ECFDF5}.v4{background:#FFFBEB}.v5{background:#FFF1F2}
.br{display:grid;gap:6px}.br b{font-size:20px}.muted{color:var(--muted)}
.tag{display:inline-block;font-size:14px;font-weight:800;padding:3px 10px;border-radius:8px}.open{background:var(--mint);color:var(--teal)}.closed{background:#FFF4D9;color:#8A6200}
.day{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}.day li{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px}.day b{color:var(--pink-d);margin-inline-end:6px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.photos img{border-radius:22px;aspect-ratio:1;object-fit:cover;width:100%}
details{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:10px}summary{font-weight:800;cursor:pointer}
.cities{display:flex;gap:10px;flex-wrap:wrap}
footer{padding:40px 0;border-top:1px solid var(--line);color:var(--muted);font-size:16px}footer .wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;align-items:center}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px}.grid3,.photos{grid-template-columns:1fr 1fr}header nav .btn-line{display:none}header img{height:46px}}
@media(max-width:520px){.grid3{grid-template-columns:1fr}body{font-size:17px}}</style>
